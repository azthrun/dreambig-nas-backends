# Mounted read-only into the rabbitmq container by compose.yaml.

# The broker cannot reliably see the container's mem_limit; tell it. Deliberately below
# mem_limit (768m) in compose.yaml, leaving room for the CLI tools' Erlang VM
# (rabbitmq-diagnostics in the healthcheck).
total_memory_available_override_value = 512MB

# Block publishers at 60% of that, leaving room for Erlang's own overhead.
vm_memory_high_watermark.relative = 0.6

# Block publishers when the volume has less than this free.
disk_free_limit.absolute = 2GB
