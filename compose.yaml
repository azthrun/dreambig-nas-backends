# Synology Container Manager Project (DS220+, linux/amd64, DSM 7.4.1, 2 GB RAM).
# Put this file, the rabbitmq folder and a filled-in copy of .env.example named .env in
# the project folder. Values in ${...} come from that .env.
#
# Images are pinned to exact versions (latest stable as of 2026-11-03). Bump them on
# purpose, one service at a time; PostgreSQL major upgrades need pg_upgrade or a dump
# and restore, never just a new tag.
#
# Each official image starts as root only to chown its data folder, then drops to its
# own unprivileged user before the server runs (postgres and redis: uid 999; rabbitmq
# alpine: uid 100, gid 101).
name: dreambig-nas-backends

services:
  postgres:
    image: postgres:18.6-trixie
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: ${TZ:-UTC}
    # Sized for a 2 GB NAS shared with other containers.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
    # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/docker, so mount
    # the parent folder (not /var/lib/postgresql/data as in older guides).
    volumes:
      - ${POSTGRES_DATA_NAS_PATH:?set POSTGRES_DATA_NAS_PATH in .env}:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    shm_size: 128m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  redis:
    image: redis:8.10.3-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # Lets redis-cli in the healthcheck authenticate without the password on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # Read by the shell in command below, so the password is not baked into the
      # container's command line.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
      TZ: ${TZ:-UTC}
    # $$ escapes compose interpolation, so the container shell expands these variables.
    # sh -c replaces the image's entrypoint run, so call docker-entrypoint.sh explicitly:
    # it chowns /data, drops to uid 999, sets the umask and loads the Redis 8 modules.
    # AOF persistence (--appendonly yes): survives restarts, loses at most about one
    # second of writes.
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --maxmemory "$$REDIS_MAXMEMORY"
        --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY"
    volumes:
      - ${REDIS_DATA_NAS_PATH:?set REDIS_DATA_NAS_PATH in .env}:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    platform: linux/amd64
    restart: unless-stopped
    # RabbitMQ names its node and data folder after the hostname; keep it fixed or the
    # broker starts empty after the container is recreated.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: ${TZ:-UTC}
    volumes:
      - ${RABBITMQ_DATA_NAS_PATH:?set RABBITMQ_DATA_NAS_PATH in .env}:/var/lib/rabbitmq
      - ./rabbitmq/10-nas.conf:/etc/rabbitmq/conf.d/10-nas.conf:ro
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      # Management UI and HTTP API.
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    # Above the broker's 512MB in rabbitmq/10-nas.conf: the healthcheck's
    # rabbitmq-diagnostics starts a second Erlang VM in the same memory limit.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
